name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check cedar tools tests
      - run: pytest -q
      - run: python tools/lang_selftest.py
      - run: python tools/align_selftest.py
      # Advisory: a fresh CVE in a dependency must be seen, not block a docs commit.
      - run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  docker:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cedar-server:ci .

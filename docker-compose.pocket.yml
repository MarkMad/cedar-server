# Add Pocket voices to Cedar while retaining Kokoro for its other languages.
# docker compose -f docker-compose.yml -f docker-compose.pocket.yml up -d --build
#
# The engine is chosen in .env: CEDAR_POCKET_IMPL picks what the image is
# ("python" or "rust", see Dockerfile.pocket) and CEDAR_POCKET_MODEL which
# model speaks ("english" or one of the small English models, listed at the
# command line below). Both values also reach Cedar's environment below, so a
# cached clip always belongs to the engine that produced it. Release note:
# a first change from the previous 3.3.0 image re-fills Pocket's cache (the
# audio itself changed upstream); Cedar's own Pocket clips re-synthesize too,
# by design — the cache prefix carries the engine identity for exactly that.
services:
  pocket:
    build:
      context: .
      dockerfile: Dockerfile.pocket
      args:
        POCKET_IMPL: ${CEDAR_POCKET_IMPL:-python}
        POCKET_VERSION: ${CEDAR_POCKET_VERSION:-4.0.0}
    # The tag names the variant and model, so the two can coexist on one host.
    image: cedar-pocket-tts:${CEDAR_POCKET_IMPL:-python}-${CEDAR_POCKET_MODEL:-english}
    cpus: ${CEDAR_POCKET_CPUS:-2}
    restart: unless-stopped
    command:
      - pocket-tts
      - serve
      - --host
      - 0.0.0.0
      # One model per deployment. "english" is the default (full) model; the
      # small and faster English models are english_18m_2026-10,
      # english_7m_2026-10 and english_2m_2026-10, each also with a _refl
      # variant. They are smaller and sharper-sounding than the default; the
      # small ones also stop sentences a touch sooner, and voices vary more.
      - --language
      - ${CEDAR_POCKET_MODEL:-english}
      # The engines' --quantize flag is deliberate, not hardcoded: the
      # entrypoint appends it only when .env sets CEDAR_POCKET_QUANTIZE=1.
      # The current image installs torchao (x86-64) for it, but ARM64's
      # fallback quantization is slower than the float engine, so the
      # default stays off. See the env entries below.
    environment:
      # Engine thread caps, sized to the same default ceiling of 2 cores.
      # RAYON_NUM_THREADS applies to the Rust engine, OMP/MKL to the Python one.
      OMP_NUM_THREADS: ${CEDAR_POCKET_CPUS:-2}
      MKL_NUM_THREADS: ${CEDAR_POCKET_CPUS:-2}
      RAYON_NUM_THREADS: ${CEDAR_POCKET_CPUS:-2}
      # The model weights that can clone a voice are gated on Hugging Face:
      # accept the terms at huggingface.co/kyutai/pocket-tts and put a read
      # token in .env. Without it Pocket runs the model that cannot clone,
      # and only its built-in voices speak.
      HF_TOKEN: ${HF_TOKEN:-}
      # Int8 inference, opt-in (1 = the engines' --quantize flag). On x86-64
      # it is worth it: roughly 1.3x faster realtime with half the memory.
      # Keep it off (the default) on ARM64 — no torchao wheels there, and the
      # fallback runs slower than the float engine. It also changes the audio
      # itself, so the entrypoint's flag must agree with Cedar's view below.
      CEDAR_POCKET_QUANTIZE: ${CEDAR_POCKET_QUANTIZE:-0}
    volumes:
      - pocket-cache:/home/pocket/.cache/pocket_tts
      - pocket-hf-cache:/home/pocket/.cache/huggingface
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SETPCAP

  # Serves the owner's own voice samples to the Pocket container, which
  # fetches them by URL — Pocket's /tts takes a voice URL, not a path.
  # Internal to the Compose network: no port is published, so the samples
  # never reach the LAN. See README, "Cloned voices".
  voicefiles:
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/voices"]
    volumes:
      - ./voices:/voices:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cedar:
    environment:
      CEDAR_POCKET_URL: http://pocket:8000
      CEDAR_TTS_LOOKAHEAD: ${CEDAR_TTS_LOOKAHEAD:-6}
      # What is above is below here too: the engine identity, so a cache key
      # can name the Pocket build that produced the clip. Set in .env and
      # nothing here changes; the variables already carry the same defaults.
      CEDAR_POCKET_IMPL: ${CEDAR_POCKET_IMPL:-python}
      CEDAR_POCKET_MODEL: ${CEDAR_POCKET_MODEL:-english}
      CEDAR_POCKET_VERSION: ${CEDAR_POCKET_VERSION:-4.0.0}
      # The int8 setting is engine identity as well — quantized weights draw
      # different audio — so both sides must agree on it for the cache keys.
      CEDAR_POCKET_QUANTIZE: ${CEDAR_POCKET_QUANTIZE:-0}
      # The owner's cloned voices: where the samples and their manifest live,
      # and the URL the Pocket container fetches a sample from.
      CEDAR_POCKET_VOICES_DIR: /voices
      CEDAR_POCKET_VOICE_BASE: http://voicefiles:8000
    volumes:
      - ./voices:/voices:ro
    depends_on:
      - pocket
      - voicefiles

volumes:
  pocket-cache:
  pocket-hf-cache:
